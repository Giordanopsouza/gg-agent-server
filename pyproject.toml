[tool.uv.workspace]
members = ["packages/gg-sdk", "packages/gg-server"]

[tool.uv.sources]
gg-sdk = { workspace = true }
gg-server = { workspace = true }

[dependency-groups]
dev = [
    "gg-sdk",
    "gg-server",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gg"]
combine-as-imports = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = [
    "packages/gg-sdk/tests",
    "packages/gg-server/tests",
    "tests",
]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "docker: opt-in tests that require Docker and the gg-agent-server:dev image",
]
