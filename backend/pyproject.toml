[project]
name = "gg-backend"
version = "0.1.0"
description = "gg control plane API and task runtime"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44,<51",
    "fastapi>=0.104",
    "gg-sdk",
    "joserfc>=1.7,<2",
    "logfire==4.41.0",
    "modal==1.5.5",
    "pydantic>=2.0",
    "uvicorn>=0.31.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["gg.runtime*"]
namespaces = true
